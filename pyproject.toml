[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beanfit"
version = "0.3.0"
description = "What local AI actually fits — and runs well — on THIS device."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BeanLabs" }]
keywords = ["local-ai", "llm", "ollama", "mlx", "apple-silicon"]

[project.scripts]
beanfit = "beanfit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
