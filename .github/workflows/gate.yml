name: gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    uses: stevekkall-beansgc/gate-kit/.github/workflows/compliance.yml@v0.4.10
    with:
      repo: beanfit
      full: false
      runner: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'beans-mac' }}
