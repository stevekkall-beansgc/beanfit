name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["macos-latest","ubuntu-latest","windows-latest"]' || '["beans-mac"]') }}
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  activation-e2e:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'beans-mac' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline synthetic activation from a shallow checkout
        run: python scripts/activation_demo.py

  package-smoke:
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["macos-latest","ubuntu-latest","windows-latest"]' || '["beans-mac"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and exercise entry points
        run: |
          pip install .
          beanfit --version
          python -m beanfit --help
