<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 530.234px; background-color: white;" viewBox="0 0 530.234375 425.4000244140625" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg"><title id="chart-title-my-svg">From your Mac to a starting recommendation</title><desc id="chart-desc-my-svg">Hardware detection and the pinned catalog feed memory and speed estimates, which rank configurations and produce a table, JSON and a suggested command. This is estimation, not inference.</desc><style>#my-svg{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#172a41;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#fff4dd;}#my-svg .error-text{fill:#000b22;stroke:#000b22;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#516174;stroke:#516174;}#my-svg .marker.cross{stroke:#516174;}#my-svg svg{font-family:Arial,Helvetica,sans-serif;font-size:18px;}#my-svg p{margin:0;}#my-svg .label{font-family:Arial,Helvetica,sans-serif;color:#172a41;}#my-svg .cluster-label text{fill:#000b22;}#my-svg .cluster-label span{color:#000b22;}#my-svg .cluster-label span p{background-color:transparent;}#my-svg .label text,#my-svg span{fill:#172a41;color:#172a41;}#my-svg .node rect,#my-svg .node ci